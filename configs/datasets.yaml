datasets:
  target_birds:
    source: "Xeno-Canto Indonesia (Aves Indonesia)"
    geographic_focus: "Sumatra & Kepulauan Sunda, Indonesia"
    num_species: 20
    split_manifest_path: "data/manifests/dataset_split.csv"
    audio_directory: "data/xeno_canto_indonesia/"
    selection_rules:
      class_name: "Aves"
      geographic_filter: "Terverifikasi hadir di Sumatera / Sundaland"
      n_klip_min: 30
      n_author_min: 14
      split_protocol: "Recordist-disjoint (Zero-Author-Overlap) DEC-10"
  open_set_negatives:
    types:
      type_a:
        description: "Vokalisasi burung non-target Indonesia di luar 20 target"
        source: "data/xeno_canto_indonesia_unknowns/"
      type_b:
        description: "Biofoni dan geofoni lingkungan kampus ITERA bebas target"
        source: "data/itera_noise/"
    split_manifest_path: "data/manifests/unknown_open_set_manifest.csv"
    calibration_count: 233
    test_count: 310
  itera_noise:
    directory: "data/itera_noise/"
    manifest_path: "data/manifests/itera_noise_manifest.csv"
    total_files: 1799
    sampling_rate: 32000
    sub_locations:
      - "Embung F ITERA (Aquatic / hydro-wind ambient)"
      - "Kebun Raya ITERA (Forest canopy biophony / insect chorus)"
      - "Gedung F ITERA (Anthropogenic traffic / structural rumble)"
  domain_shift_e4:
    source: "Profil noise lapangan ITERA untuk additive-mixture sensitivity (E4)"
    directory: "data/itera_noise/"
    locations:
      - "Kebun_Raya"
      - "Embung_F"
      - "Gedung_F"
      - "Masjid_At_Tanwir"
      - "Sekitar_GKU_1"
    interpretation_scope: "additive noise-profile sensitivity; supports H3 retention-stability comparison, not an in-situ bird soundscape claim"
